name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup configuration
        run: |
          # Use secrets first, fallback to repository variables
          # Secrets take precedence over repository variables
          # GitHub Actions: secrets.* for secrets, vars.* for repository variables
          SSH_HOST="${{ secrets.SSH_HOST || vars.SSH_HOST }}"
          SSH_USER="${{ secrets.SSH_USER || vars.SSH_USER }}"
          SSH_PORT="${{ secrets.SSH_PORT || vars.SSH_PORT || 22 }}"
          APP_DIR="${{ secrets.APP_DIRECTORY || vars.APP_DIRECTORY || '/home/ubuntu/SumtubeBot' }}"
          
          # Validate required values
          if [ -z "$SSH_HOST" ]; then
            echo "❌ Error: SSH_HOST is not set!"
            echo "   Please add SSH_HOST to repository secrets or repository variables"
            exit 1
          fi
          if [ -z "$SSH_USER" ]; then
            echo "❌ Error: SSH_USER is not set!"
            echo "   Please add SSH_USER to repository secrets or repository variables"
            exit 1
          fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ Error: SSH_PRIVATE_KEY secret is not set!"
            echo "   SSH_PRIVATE_KEY must be in repository secrets"
            exit 1
          fi
          
          # Export for use in subsequent steps
          echo "SSH_HOST=$SSH_HOST" >> $GITHUB_ENV
          echo "SSH_USER=$SSH_USER" >> $GITHUB_ENV
          echo "SSH_PORT=$SSH_PORT" >> $GITHUB_ENV
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
          
          echo "✅ Configuration loaded:"
          echo "   SSH_HOST: $SSH_HOST"
          echo "   SSH_USER: $SSH_USER"
          echo "   SSH_PORT: $SSH_PORT"
          echo "   APP_DIR: $APP_DIR"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          echo "🔑 Adding $SSH_HOST:$SSH_PORT to known hosts..."
          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "✅ Server added to known hosts"

      - name: Deploy to server
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << EOF
            set -e
            
            # Configuration
            APP_DIR="${{ env.APP_DIR }}"
            # Get branch from GitHub Actions context (works for both push and workflow_dispatch)
            BRANCH="${{ github.ref_name }}"
            
            echo "🚀 Starting GitHub Actions deployment..."
            echo "📂 Target directory: \$APP_DIR"
            echo "🌿 Branch: \$BRANCH"
            echo ""
            
            # Navigate to app directory
            cd "\$APP_DIR" || {
              echo "❌ Directory \$APP_DIR not found!"
              exit 1
            }
            
            # Pull latest code (to get the latest deployment script and code)
            echo "📥 Pulling latest code from \$BRANCH branch..."
            git fetch origin
            git checkout "\$BRANCH"
            git pull origin "\$BRANCH" || {
              echo "⚠️  Git pull failed, continuing with existing code..."
            }
            echo ""
            
            # Check if deployment script exists
            if [ ! -f "deploy/production-deploy.sh" ]; then
              echo "❌ Deployment script not found: deploy/production-deploy.sh"
              echo "   Make sure the repository is cloned correctly"
              exit 1
            fi
            
            # Make script executable
            chmod +x deploy/production-deploy.sh
            
            # Run deployment script
            # Skip pull because we already pulled above
            # Skip backup for faster CI/CD
            echo "📋 Running deployment script..."
            ./deploy/production-deploy.sh --skip-backup --skip-pull "\$BRANCH"
          EOF

      - name: Deployment Status
        run: |
          echo "✅ Deployment workflow completed"
          echo "Check your server logs with: pm2 logs sumtubebot"

